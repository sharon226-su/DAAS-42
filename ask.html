<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問答｜年齡與憂鬱、焦慮、壓力的關係</title>
<link rel="stylesheet" href="style.css">
<style>
  .conn h2{margin:0 0 4px}
  .conn .sub{margin:0 0 12px}
  .conn button{
    font:inherit; font-size:.92rem; font-weight:600; padding:8px 18px; border:0; border-radius:8px;
    background:var(--accent); color:var(--accent-fg); cursor:pointer;
  }
  .conn button:disabled{opacity:.6; cursor:wait}
  .conn button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  #connResult, #geminiResult, #qaResult{margin:12px 0 0; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--grid); font-size:.9rem; white-space:pre-wrap; word-break:break-word}
  #connResult[hidden], #geminiResult[hidden], #qaResult[hidden]{display:none}
  #connResult.err, #geminiResult.err, #qaResult.err{border-color:var(--accent)}
  .qa-label{display:block; font-size:.8rem; color:var(--muted); margin-bottom:4px}
  .qa-row{display:flex; gap:10px; flex-wrap:wrap}
  .qa-row input{flex:1 1 240px; min-width:0; font:inherit; font-size:.95rem; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg)}
  .qa-row input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">年齡與憂鬱、焦慮、壓力</a>
    <nav aria-label="主選單"><a href="index.html">首頁</a><a href="results.html">研究結果</a><a href="ask.html" aria-current="page">問答</a><a href="about.html">關於研究</a></nav>
  </div>
</header>
<main class="page">
  <h1>問答</h1>
  <section class="card conn qa" aria-labelledby="qaTitle">
    <h2 id="qaTitle">提問</h2>
    <p class="sub">回答只根據研究的摘要表；摘要表沒有的內容會直接說沒有。</p>
    <form id="qaForm">
      <label class="qa-label" for="qaInput">請輸入問題</label>
      <div class="qa-row">
        <input type="text" id="qaInput" maxlength="500" autocomplete="off" placeholder="例如：20–29 歲的憂鬱平均是多少？" required>
        <button type="submit" id="qaBtn">送出</button>
      </div>
    </form>
    <div id="qaResult" role="status" aria-live="polite" hidden></div>
  </section>
  <section class="card conn" aria-labelledby="connTitle">
    <h2 id="connTitle">測試連線</h2>
    <p class="sub">向後端送出 action 為 test 的 POST 請求，並顯示回應。</p>
    <button type="button" id="connBtn">測試連線</button>
    <div id="connResult" role="status" aria-live="polite" hidden></div>
  </section>

  <section class="card conn" aria-labelledby="geminiTitle">
    <h2 id="geminiTitle">測試 Gemini</h2>
    <p class="sub">向後端送出固定問題「請用一句話自我介紹」，並顯示 Gemini 的回覆。</p>
    <button type="button" id="geminiBtn">測試 Gemini</button>
    <div id="geminiResult" role="status" aria-live="polite" hidden></div>
  </section>
</main>
<footer class="site-footer">
  <div class="wrap">
    <span>組別：〔請填入組別〕</span>
    <span>組員：〔請填入組員姓名〕</span>
  </div>
</footer>
<script>
const API_URL = 'https://dass-42.sharon6966188.workers.dev/';

// 對後端送出 POST（JSON），回傳狀態與解析後的內容
async function callApi(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const raw = await res.text();
  let data = null;
  try { data = JSON.parse(raw); } catch (e) { /* 回應不是 JSON */ }
  return { res, raw, data };
}

const NETWORK_ERROR = '連線失敗：無法連到後端。請確認網路連線、後端網址是否正確，以及後端是否已部署並允許此網站呼叫（CORS）。';

// ===== 測試連線 =====
const btn = document.getElementById('connBtn');
const out = document.getElementById('connResult');

function show(text, isError) {
  out.textContent = text;
  out.className = isError ? 'err' : '';
  out.hidden = false;
}

btn.addEventListener('click', async () => {
  btn.disabled = true;
  show('連線中…', false);
  try {
    const { res, raw, data } = await callApi({ action: 'test' });
    if (res.ok) {
      show('連線成功（狀態碼 ' + res.status + '）\n回應：' + (data !== null ? JSON.stringify(data) : raw), false);
    } else {
      const msg = (data && data.error) ? data.error : (raw || '沒有回應內容');
      show('連線失敗（狀態碼 ' + res.status + '）\n錯誤訊息：' + msg, true);
    }
  } catch (err) {
    show(NETWORK_ERROR + '\n（' + err.message + '）', true);
  } finally {
    btn.disabled = false;
  }
});

// ===== 測試 Gemini =====
const gBtn = document.getElementById('geminiBtn');
const gOut = document.getElementById('geminiResult');

function gShow(text, isError) {
  gOut.textContent = text;
  gOut.className = isError ? 'err' : '';
  gOut.hidden = false;
}

gBtn.addEventListener('click', async () => {
  gBtn.disabled = true;
  gShow('等待 Gemini 回覆中…', false);
  try {
    const { res, raw, data } = await callApi({ action: 'ask', question: '請用一句話自我介紹' });
    if (res.ok && data && typeof data.answer === 'string') {
      gShow(data.answer, false);
    } else {
      const msg = (data && data.error) ? data.error : (raw || '沒有回應內容');
      gShow('呼叫失敗（狀態碼 ' + res.status + '）\n錯誤訊息：' + msg, true);
    }
  } catch (err) {
    gShow(NETWORK_ERROR + '\n（' + err.message + '）', true);
  } finally {
    gBtn.disabled = false;
  }
});

// ===== 問答 =====
const qaForm = document.getElementById('qaForm');
const qaInput = document.getElementById('qaInput');
const qaBtn = document.getElementById('qaBtn');
const qaOut = document.getElementById('qaResult');

function qaShow(text, isError) {
  qaOut.textContent = text;
  qaOut.className = isError ? 'err' : '';
  qaOut.hidden = false;
}

qaForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = qaInput.value.trim();
  if (question === '') {
    qaShow('請先輸入問題。', true);
    return;
  }
  qaBtn.disabled = true;
  qaInput.disabled = true;
  qaShow('回答中…', false);
  try {
    const { res, raw, data } = await callApi({ action: 'ask', question });
    if (res.ok && data && typeof data.answer === 'string') {
      qaShow(data.answer, false);
    } else {
      const msg = (data && data.error) ? data.error : (raw || '沒有回應內容');
      qaShow('回答失敗（狀態碼 ' + res.status + '）\n錯誤訊息：' + msg, true);
    }
  } catch (err) {
    qaShow(NETWORK_ERROR + '\n（' + err.message + '）', true);
  } finally {
    qaBtn.disabled = false;
    qaInput.disabled = false;
    qaInput.focus();
  }
});
</script>
</body>
</html>
